<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南孚浏览器</title>
<style>
  :root {
    --primary: #2457D6;
    --bg: #0d1220;
    --card: #161d30;
    --card-hover: #1c2540;
    --text: #e8ecf6;
    --muted: #9aa3bd;
    --border: #242d48;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }
  .hero {
    max-width: 900px;
    margin: 0 auto;
    padding: 80px 24px 40px;
    text-align: center;
  }
  .logo-badge {
    display: inline-block;
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 16px;
    margin-bottom: 28px;
  }
  h1 {
    font-size: clamp(40px, 7vw, 64px);
    font-weight: 700;
    letter-spacing: 1px;
  }
  .tagline {
    margin-top: 20px;
    font-size: clamp(15px, 2.4vw, 18px);
    color: var(--muted);
  }
  .tagline span { color: var(--text); }
  .features {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 24px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    transition: transform .2s ease, background .2s ease, border-color .2s ease;
  }
  .card:hover {
    background: var(--card-hover);
    border-color: var(--primary);
    transform: translateY(-3px);
  }
  .card .icon {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    background: rgba(36, 87, 214, .16);
    color: #6d94f0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin-bottom: 16px;
  }
  .card h3 { font-size: 18px; margin-bottom: 8px; }
  .card p { font-size: 14px; color: var(--muted); }
  .download {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    text-align: center;
  }
  .download-card {
    background: linear-gradient(135deg, #1a2a5e, #161d30);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 28px;
  }
  .version {
    display: inline-block;
    font-size: 13px;
    color: #a8b6ff;
    background: rgba(36, 87, 214, .18);
    border-radius: 999px;
    padding: 5px 14px;
    margin-bottom: 18px;
  }
  .btn {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    text-decoration: none;
    font-size: 17px;
    font-weight: 600;
    padding: 16px 44px;
    border-radius: 12px;
    transition: background .2s ease, transform .2s ease;
    margin-top: 8px;
  }
  .btn:hover { background: #1c47b8; transform: translateY(-2px); }
  .hint { margin-top: 16px; font-size: 13px; color: var(--muted); }
  footer {
    text-align: center;
    padding: 32px 24px;
    font-size: 13px;
    color: var(--muted);
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>
  <div class="hero">
    <div class="logo-badge">NANFU BROWSER</div>
    <h1>南孚浏览器</h1>
    <p class="tagline"><span>多账号指纹隔离</span> · 独立代理 · 云端环境无损转移 · 团队配额管理</p>
  </div>

  <div class="features">
    <div class="card">
      <div class="icon">🛡️</div>
      <h3>指纹隔离</h3>
      <p>每个账号拥有独立浏览器指纹，多开互不关联，安全运营。</p>
    </div>
    <div class="card">
      <div class="icon">🌐</div>
      <h3>独立代理</h3>
      <p>为每个环境绑定独立代理 IP，网络出口彼此隔离。</p>
    </div>
    <div class="card">
      <div class="icon">☁️</div>
      <h3>云端转移</h3>
      <p>环境配置云端同步，换机无损迁移，即登即用。</p>
    </div>
    <div class="card">
      <div class="icon">👥</div>
      <h3>团队账号与配额</h3>
      <p>多成员协同管理，灵活分配环境数量与使用配额。</p>
    </div>
  </div>

  <div class="download">
    <div class="download-card">
      <div class="version">版本 0.1.0-beta.72 · Windows x64</div>
      <div>
        <a class="btn" href="https://dl.xzckfn.eu.cc/nanfu/0.1.0-beta.72/win-x64/%E5%8D%97%E5%AD%9A%E6%B5%8F%E8%A7%88%E5%99%A8_0.1.0-beta.72_x64-setup.exe">立即下载</a>
      </div>
      <p class="hint">适用于 Windows 64 位系统</p>
    </div>
  </div>

  <footer>
    © 2026 南孚浏览器
  </footer>
</body>
</html>
